<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Subtle Light) -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Trend Arrow Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Light Graph Paper Grid -->
    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-opacity="0.6" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow1">
        <feFuncA type="linear" slope="1.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Drop Shadow for Text Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgLight)" />
  <rect width="512" height="512" rx="115" fill="url(#gridLight)" />

  <!-- Formula Text -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" filter="url(#shadow)">
    <!-- P = -->
    <text x="85" y="290" font-size="100" fill="#1e293b">P</text>
    <text x="160" y="280" font-size="80" fill="#475569">=</text>

    <!-- D_1 -->
    <text x="225" y="195" font-size="95" fill="#38bdf8">D</text>
    <text x="295" y="195" font-size="50" fill="#1e293b">1</text>

    <!-- r - g -->
    <text x="220" y="390" font-size="85" fill="#1e293b">r</text>
    <text x="265" y="380" font-size="85" fill="#475569">-</text>
    <text x="305" y="390" font-size="85" fill="#1e293b">g</text>
  </g>

  <!-- Glowing Trend Arrow (Division Bar) -->
  <g filter="url(#glow)">
    <!-- Main Path -->
    <path d="M 220 270 L 350 270 L 415 190" fill="none" stroke="url(#neonGreen)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Arrowhead -->
    <polygon points="385,180 430,175 425,220" fill="url(#neonGreen)" />
  </g>

  <!-- Subtle Inner Edge Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.8" />
</svg>
