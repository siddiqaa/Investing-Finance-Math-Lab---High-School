<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Upward Trend / Division Bar Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Chart Background Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <!-- Glass Reflection Highlight -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Math Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Filters for Neon Glow & Drop Shadows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base Shape -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Graph Paper / Math Grid Background -->
  <rect width="512" height="512" rx="115" fill="url(#grid)" />

  <!-- Abstract Finance Area Chart in Background -->
  <path d="M 0 400 L 90 370 L 190 420 L 310 260 L 420 310 L 512 180 L 512 512 L 0 512 Z" fill="url(#chartGrad)" />

  <!-- Faint Math Motifs for High School Vibe -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="45" fill="#ffffff" opacity="0.04" text-anchor="middle">
    <text x="80" y="140">∑</text>
    <text x="440" y="120">π</text>
    <text x="80" y="440">%</text>
    <text x="440" y="450">∫</text>
    <text x="256" y="90" font-style="italic">f(x)</text>
    <text x="256" y="460">$</text>
  </g>

  <!-- Central Gordon Growth Formula -->
  <g filter="url(#textShadow)">
    
    <!-- P (Price) -->
    <text x="120" y="285" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="110" font-weight="bold" fill="#f8fafc" text-anchor="middle">P</text>
    
    <!-- Equals Sign -->
    <text x="220" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="70" font-weight="bold" fill="#cbd5e1" text-anchor="middle">=</text>

    <!-- D (Dividend) -->
    <text x="355" y="185" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="90" font-weight="bold" fill="#f8fafc" text-anchor="middle">D</text>
    
    <!-- Subscript 1 -->
    <text x="400" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="45" font-weight="bold" fill="#f8fafc" text-anchor="start">1</text>

    <!-- r - g (Rate - Growth) -->
    <text x="315" y="375" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="70" font-weight="bold" fill="#f8fafc" text-anchor="middle">r</text>
    <text x="365" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="bold" fill="#94a3b8" text-anchor="middle">-</text>
    <text x="415" y="375" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="70" font-weight="bold" fill="#f8fafc" text-anchor="middle">g</text>

  </g>

  <!-- Glowing Trend Arrow (Acts as the division bar) -->
  <g filter="url(#neonGlow)">
    <!-- Main Upward Slanting Line -->
    <path d="M 275 285 L 450 220" fill="none" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Arrowhead -->
    <path d="M 420 200 L 450 220 L 425 255" fill="none" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glass Top Highlight (iOS style app icon depth) -->
  <rect x="4" y="4" width="504" height="254" rx="111" fill="url(#glass)" />

  <!-- Inner Stroke Border for Polish -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

</svg>
